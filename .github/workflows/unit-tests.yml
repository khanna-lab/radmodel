name: unit-tests
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
            mpi: mpich
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.9.25
      - name: Install dependencies
        env:
          CC: mpich
          MPICC: mpich
        run: uv sync --locked
      - name: Unit test with pytest
        run: uv run pytest .
