name: unit-tests
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v9
      - name: Setup MPI
        run: sudo apt-get install libopenmpi-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.9.25
          python-version: 3.13
      - name: Install dependencies
        env:
          CC: mpich
          MPICC: mpich
          CXX: mpicxx
        run: uv sync
      - name: Unit test with pytest
        run: uv run pytest .
