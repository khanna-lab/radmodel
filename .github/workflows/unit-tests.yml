name: unit-tests
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
            version: 0.9.25
      - name: Install dependencies
        env:
          CC: mpicc
          MPICC: mpicc
        run: uv sync
      - name: Unit test with pytest
        run: uv run pytest .